[project]
name = "snake-pfn"
version = "0.1.0"
description = "Snake learns action values with TabPFN and interchangeable observations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "python-dotenv>=1,<2",
  "tabpfn-client>=0.6,<0.7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
snake-pfn = "snake_pfn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake / TabPFN</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <span id="mode-badge" class="badge" hidden>debug · stub model, no TabPFN calls</span>
  </header>
  <div class="workspace">
  <section id="game-panel" class="panel game-view" aria-labelledby="you-title">
    <div class="panel-heading"><h2 id="you-title">What you see</h2><p id="evaded" hidden>you evaded <strong id="hungry">0</strong>/<span id="limit">20</span></p></div>
    <div class="board-wrap">
      <canvas id="board" width="640" height="640" aria-label="Snake game board. While TabPFN plays, an arrow from the head shows each turn it considers; the brightest arrow is its pick."></canvas>
      <div id="overlay" class="overlay" role="status" hidden>
        <strong id="overlay-title"></strong>
        <small id="overlay-progress"></small>
      </div>
    </div>
    <div class="controls">
      <button id="play" class="primary" disabled>Play</button>
    </div>
    <p id="apple-hint" class="hint apple-hint" hidden>🍎 <strong>You are the apple.</strong> Arrow keys or tap to step away. Survive <span class="limit">20</span> moves.</p>
    <p id="setup" class="hint" hidden>To let TabPFN play, add TABPFN_TOKEN to .env and restart the server.</p>
    <p id="error" role="alert" hidden></p>
  </section>
  <section id="data-view" class="panel tabpfn" aria-labelledby="tabpfn-title">
    <div class="panel-heading">
      <h2 id="tabpfn-title">What TabPFN sees</h2>
      <span id="memory" class="hint">0 saved moves</span>
    </div>
    <p class="hint">Each row is a previous move.</p>
    <div class="table-frame">
      <div class="table-scroll" tabindex="0" role="region" aria-label="Training data, scroll to see all columns">
        <table id="training-table" aria-label="TabPFN training data"></table>
      </div>
    </div>
    <div class="pagination">
      <button id="table-prev" disabled aria-label="Previous data rows">←</button>
      <span id="table-page"></span>
      <button id="table-next" disabled aria-label="Next data rows">→</button>
    </div>
    <details class="advanced">
      <summary>Advanced</summary>
      <div class="advanced-controls">
        <select id="inputs" disabled aria-label="Model inputs" title="Changing inputs makes TabPFN retrain at its next game; saved moves stay.">
          <option value="board">Inputs: board</option>
          <option value="compact">Inputs: measurements</option>
          <option value="augmented" selected>Inputs: board + measurements</option>
          <option id="custom-inputs" value="custom" disabled hidden>Inputs: custom</option>
        </select>
        <button id="clear" disabled title="Archives the saved moves to a file and starts over.">Clear table</button>
        <button id="replay-intro">Replay intro</button>
      </div>
    </details>
    <p id="table-error" role="alert" hidden></p>
  </section>
  </div>
  <section id="log-view" class="panel" aria-label="Debug log">
    <div class="panel-heading">
      <h2>Log</h2>
      <div class="log-controls">
        <span id="log-count" class="hint">0 entries</span>
        <label class="hint"><input type="checkbox" id="log-follow" checked> Follow</label>
        <button id="log-clear">Clear log</button>
      </div>
    </div>
    <div id="log-scroll" tabindex="0" role="log" aria-live="off">
      <div id="log-entries"></div>
    </div>
  </section>
</main>
<div id="tour" class="tour" data-place="center" role="dialog" aria-live="polite" hidden>
  <h2 id="tour-title"></h2>
  <div id="tour-body"></div>
  <div class="tour-actions">
    <span id="tour-dots" class="dots"></span>
    <button id="tour-next" class="primary">Next</button>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
